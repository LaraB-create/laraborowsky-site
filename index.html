<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lara Borowsky</title>
<meta name="description" content="Lara Borowsky: marketing, brand systems, and things I build with AI.">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  :root { --ink:#1d1b19; --muted:#6b645c; --paper:#f7f3ec; --accent:#c4542b; --line:#e3dccf; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--paper); color:var(--ink);
         font:17px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { flex:1; width:min(720px, 100% - 48px); margin:0 auto; padding:14vh 0 64px; }
  .kicker { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600; margin:0 0 18px; }
  h1 { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; font-weight:400; font-size:clamp(44px, 8vw, 76px);
       line-height:1.02; letter-spacing:-.02em; margin:0 0 24px; }
  p.lede { font-size:20px; color:var(--muted); max-width:34ch; margin:0 0 48px; }
  .lavalou { position:relative; overflow:hidden; display:flex; flex-wrap:wrap; align-items:center; gap:18px 32px;
             padding:28px 32px; border-radius:22px; background:#2446CC; color:#FFF8E8; text-decoration:none;
             transition:transform .18s, box-shadow .18s; box-shadow:0 0 0 0 #D7F442; }
  .lavalou:hover { transform:translateY(-2px); box-shadow:6px 6px 0 0 #D7F442; }
  .lavalou:focus-visible { outline:3px solid #D7F442; outline-offset:3px; }
  .lavalou img { position:relative; width:240px; height:auto; flex:none; display:block; }
  .lv-text { position:relative; flex:1 1 220px; padding-right:48px; font-size:18px; line-height:1.4; font-weight:600; }
  .lv-kicker { display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; opacity:.75; margin-bottom:4px; }
  .lv-arrow { display:inline-block; transition:transform .18s; }
  .lavalou:hover .lv-arrow { transform:translateX(4px); }
  .lv-blob { position:absolute; width:110px; height:100px; right:-38px; top:-42px; background:#D7F442;
             border-radius:42% 58% 63% 37% / 45% 40% 60% 55%; opacity:.95; }
  @media (max-width:560px) { .lavalou { padding:24px; } .lavalou img { width:220px; } }
  .soon { color:var(--muted); font-size:15px; margin-top:28px; }
  footer { width:min(720px, 100% - 48px); margin:0 auto; padding:24px 0 32px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <p class="kicker">Lara Borowsky</p>
  <h1>Marketing, brand systems, and things I build.</h1>
  <p class="lede">A home for my professional work and the tools I make along the way.</p>
  <a class="lavalou" href="/lavalou" aria-label="Lavalou: games and tools for family and fun">
    <span class="lv-blob" aria-hidden="true"></span>
    <img src="/lavalou/assets/brand/lavalou-horizontal-lime.svg" alt="" width="240" height="99">
    <span class="lv-text"><span class="lv-kicker">My creative label</span>Games and tools I make for family and fun <span class="lv-arrow">&rarr;</span></span>
  </a>
  <p class="soon">Portfolio and professional work coming soon.</p>
</main>
<footer>&copy; <span id="y">2026</span> Lara Borowsky</footer>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
