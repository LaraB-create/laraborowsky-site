/* Layout: one letterboxed game stage (800–1067 × 600 logical px) scaled to fit the window.
   The canvas draws the night-time city; chunky "sticker" UI cards sit on top.
   Single deliberate visual world (a city at night), so one theme only. */
:root{
  --ink:#1a1433; --night:#0d1030; --night2:#1d2460;
  --paper:#fff7e6; --paper-line:#d9e6ff;
  --corn:#ffd23f; --pumpkin:#ff8a1e; --coop:#e5483b; --mint:#36d39f; --sky:#62c0ff; --grape:#9a6bff;
  --text:#1a1433; --muted:#5d527a; --good:#13945a; --oops:#c8322a;
  --font-display:"Titan One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--font-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;height:100%;box-sizing:border-box;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  background:radial-gradient(ellipse at 50% 0%,var(--night2) 0%,var(--night) 70%)}
#stage{position:absolute;left:50%;top:50%;width:960px;height:600px;transform-origin:50% 50%;border-radius:18px;overflow:hidden;
  box-shadow:0 0 0 4px var(--ink),0 18px 50px rgba(0,0,0,.55);background:#101436}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;font-size:18px;color:var(--text)}
#ui .layer{position:absolute;inset:0;pointer-events:none}
#rotateTip{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-family:var(--font-display);font-size:14px;color:var(--ink);
  background:var(--corn);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;white-space:nowrap;z-index:5}
button,input,select,.pe,.panel,.chip.pe{pointer-events:auto}
button{font:inherit}

/* Buttons: chunky stickers */
.btn{font-family:var(--font-display);font-size:20px;letter-spacing:.02em;color:var(--ink);background:var(--corn);border:3px solid var(--ink);
  border-radius:14px;padding:10px 18px;box-shadow:0 5px 0 var(--ink);cursor:pointer;line-height:1.1;transition:transform .08s,box-shadow .08s,filter .1s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn:focus-visible,.key:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:grayscale(.5);transform:none;box-shadow:0 5px 0 var(--ink)}
.btn.pumpkin{background:var(--pumpkin)} .btn.mint{background:var(--mint)} .btn.sky{background:var(--sky)}
.btn.grape{background:var(--grape);color:#fff} .btn.paper{background:var(--paper)} .btn.coop{background:var(--coop);color:#fff}
.btn.sm{font-size:15px;padding:6px 11px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.btn.sm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.lg{font-size:26px;padding:14px 26px;border-radius:18px}
.btn.icon{width:46px;height:46px;padding:0;border-radius:12px}
.btn svg{flex:none}

.panel{background:var(--paper);color:var(--text);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 rgba(10,8,30,.5)}
.lined{background-color:var(--paper);background-image:repeating-linear-gradient(180deg,transparent 0 33px,var(--paper-line) 33px 35px)}
h1,h2,h3,.display{font-family:var(--font-display);font-weight:400;margin:0;letter-spacing:.01em;text-wrap:balance}
p{margin:0}

/* Chips & HUD */
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,247,230,.96);border:3px solid var(--ink);border-radius:999px;
  padding:3px 12px 3px 8px;font-family:var(--font-display);font-size:18px;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4);white-space:nowrap;font-variant-numeric:tabular-nums}
.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hud .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hearts{display:inline-flex;gap:1px}
.objective{position:absolute;top:60px;left:50%;transform:translateX(-50%);max-width:80%;text-align:center;font-family:var(--font-display);
  font-size:17px;color:var(--ink);background:var(--corn);border:3px solid var(--ink);border-radius:12px;padding:5px 14px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.actionBtn{position:absolute;right:18px;bottom:20px;font-size:24px;padding:14px 24px}
.chickbar{position:absolute;left:12px;bottom:14px;display:flex;gap:4px;align-items:center;background:rgba(255,247,230,.92);border:3px solid var(--ink);
  border-radius:14px;padding:4px 8px}
.chickbar .lbl{font-family:var(--font-display);font-size:14px;color:var(--ink);margin-right:4px}

/* Modals */
#ui .modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,6,28,.62);pointer-events:auto;animation:fadein .18s ease-out}
#ui .modal.clear{background:transparent;pointer-events:none}
#ui .modal.clear>*{pointer-events:auto}
.card{width:min(92%,760px);max-height:94%;overflow:auto;padding:20px 24px;box-sizing:border-box;animation:pop .22s ease-out}
.card h2{font-size:30px;color:var(--ink)}
.card .sub{color:var(--muted);font-size:17px;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end} .row.center{justify-content:center}
.x{position:absolute;top:10px;right:10px}

/* Dialogue */
.dlg{position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:16px;align-items:center;padding:14px 18px 14px 14px;min-height:150px;box-sizing:border-box;animation:slideup .2s ease-out}
.dlg .portrait{flex:none;width:122px;height:122px;border-radius:18px;background:radial-gradient(circle at 50% 38%,#fffdf6 0%,#ffe7b0 75%);border:3px solid var(--ink);overflow:hidden}
.dlg .portrait canvas{display:block}
.dlg .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-self:stretch}
.dlg .who{font-family:var(--font-display);font-size:20px;color:var(--coop);display:flex;align-items:center;gap:10px}
.dlg .txt{font-size:23px;line-height:1.4;color:var(--ink);min-height:64px}
.dlg .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:auto}
.dlg .acts .btn{font-size:17px;padding:8px 14px}

/* Math */
.math{display:flex;gap:22px;align-items:center;justify-content:center}
.math .left{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0;flex:1}
.story{font-size:20px;line-height:1.35;max-width:400px;text-align:center;color:var(--ink)}
.eq{font-family:var(--font-body);font-weight:700;font-size:46px;color:var(--ink);display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.eq .slot{min-width:118px;height:62px;padding:0 10px;border:3px dashed var(--ink);border-radius:14px;background:#fff;display:grid;place-items:center;box-sizing:border-box}
.eq .slot.ok{background:#d6ffe9;border:3px solid var(--good);color:var(--good)}
.eq .slot.no{background:#ffe1df;border-style:solid}
.hint{font-size:18px;line-height:1.35;color:var(--muted);max-width:420px;text-align:center;min-height:26px}
.hint.good{color:var(--good);font-weight:700} .hint.oops{color:var(--oops);font-weight:700}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;flex:none}
.key{font-family:var(--font-display);font-size:26px;height:52px;border-radius:12px;padding:0;box-shadow:0 4px 0 var(--ink)}
.key.go{background:var(--mint)} .key.del{background:var(--paper)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:12px;flex:none}
.choice{font-family:var(--font-body);font-weight:700;font-size:32px;padding:8px 18px;min-width:120px}
.mathtop{display:flex;align-items:center;gap:10px}
.opbadge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);font-family:var(--font-body);font-weight:700;font-size:20px;line-height:1;background:#fff;color:var(--ink)}
.shake{animation:shake .4s}

/* Battle */
.bpanel{position:absolute;left:14px;right:14px;bottom:12px;padding:12px 16px;box-sizing:border-box}
.atkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:8px}
.atk{flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:7px 11px;font-size:17px;position:relative}
.atk .meta{font-family:var(--font-body);font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center;color:var(--ink)}
.atk .super{position:absolute;top:-10px;right:-6px;background:var(--coop);color:#fff;font-size:12px;border:2px solid var(--ink);border-radius:8px;padding:2px 6px;transform:rotate(6deg)}
.bbar{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.binfo{background:rgba(255,247,230,.96);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;color:var(--ink);min-width:200px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.binfo .nm{font-family:var(--font-display);font-size:18px}
.hpbar{height:16px;border:3px solid var(--ink);border-radius:10px;background:#3b2f5c;overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;background:linear-gradient(180deg,#7dffb8,#22c07a);transition:width .4s ease-out}
.weak{font-size:14px;font-weight:700;margin-top:3px;display:flex;align-items:center;gap:6px}
.bubble{position:absolute;max-width:300px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-size:17px;line-height:1.3;
  box-shadow:0 3px 0 rgba(0,0,0,.35);animation:pop .2s ease-out}

/* Grids for shop / backpack */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tab{font-family:var(--font-display);font-size:16px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:6px 12px;cursor:pointer;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--corn)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.item{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:10px;display:flex;flex-direction:column;gap:6px;color:var(--ink);min-width:0}
.item .top{display:flex;gap:10px;align-items:center}
.item canvas{flex:none;border-radius:12px;background:radial-gradient(circle at 50% 40%,#fffaf0,#ffe9c2)}
.item .nm{font-family:var(--font-display);font-size:17px;line-height:1.15}
.item .ds{font-size:15px;line-height:1.3;color:var(--muted)}
.item .btn{align-self:flex-start;margin-top:auto}
.pts{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.note{font-size:15px;color:var(--muted)}

/* Settings */
.set{display:grid;gap:14px}
.set fieldset{border:3px solid var(--ink);border-radius:14px;padding:10px 14px;margin:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.set legend{font-family:var(--font-display);font-size:17px;padding:0 6px}
.set label{display:inline-flex;align-items:center;gap:6px;font-size:17px;cursor:pointer}
.set input[type=checkbox],.set input[type=radio]{width:22px;height:22px;accent-color:var(--grape)}
.set input[type=text],.set input[type=number]{font:inherit;font-size:16px;border:3px solid var(--ink);border-radius:10px;padding:5px 8px;background:#fff;color:var(--ink);min-width:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%}
.stat{border:2px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff}
.stat b{font-family:var(--font-display);font-weight:400;font-size:22px;display:block;font-variant-numeric:tabular-nums}

/* Title */
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:70px;gap:10px;pointer-events:none}
.logo{font-family:var(--font-display);font-size:92px;line-height:.95;color:var(--corn);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;
  text-shadow:0 7px 0 var(--ink),0 12px 24px rgba(0,0,0,.5);transform:rotate(-3deg);text-align:center}
.logo small{display:block;font-size:30px;color:var(--pumpkin);-webkit-text-stroke:3px var(--ink);margin-top:8px;transform:rotate(2deg)}
.tagline{font-family:var(--font-display);font-size:20px;color:var(--paper);text-shadow:0 2px 0 var(--ink);margin-top:6px}
.menu{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:18px}
.corner{position:absolute;right:14px;bottom:14px;display:flex;gap:8px}

/* News */
.lower{position:absolute;left:24px;right:24px;bottom:18px;display:flex;flex-direction:column}
.lower .tag{align-self:flex-start;font-family:var(--font-display);font-size:18px;color:#fff;background:var(--coop);border:3px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;padding:4px 14px}
.lower .box{display:flex;gap:14px;align-items:flex-end;padding:12px 16px;border-radius:0 16px 16px 16px}
.lower .txt{flex:1;font-size:23px;line-height:1.4;color:var(--ink);min-height:96px}

/* Hero select */
.heroes{position:absolute;left:0;right:0;top:92px;display:flex;justify-content:center;gap:22px}
.hcard{width:228px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:4px solid var(--ink);border-radius:20px;background:var(--paper);color:var(--ink);
  box-shadow:0 7px 0 var(--ink);transition:transform .12s}
.hcard:hover{transform:translateY(-4px)} .hcard[aria-pressed="true"]{background:#fff3b0;transform:translateY(-6px) rotate(-1deg)}
.hcard .nm{font-family:var(--font-display);font-size:22px}
.hcard .ds{font-size:15px;text-align:center;line-height:1.3;min-height:40px}

/* Map */
.node{position:absolute;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;padding:5px 10px;text-align:center;line-height:1.1;min-width:90px}
.node .st{font-family:var(--font-body);font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px}
.node.locked{background:#bdb6cf}
.clockbox{display:flex;align-items:center;gap:8px}

.toast{position:absolute;top:104px;left:50%;transform:translateX(-50%);font-family:var(--font-display);font-size:20px;color:var(--ink);background:var(--paper);
  border:3px solid var(--ink);border-radius:14px;padding:8px 16px;box-shadow:0 4px 0 rgba(0,0,0,.4);animation:pop .2s ease-out;white-space:nowrap;pointer-events:none}
.toast.gold{background:var(--corn)} .toast.mint{background:var(--mint)}
.gift{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;width:min(90%,460px)}
.gift .burst{font-family:var(--font-display);font-size:16px;color:var(--grape);text-transform:uppercase;letter-spacing:.08em}

.coupon{border:3px dashed var(--ink);border-radius:14px;padding:10px 14px;background:#fff8d6;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ink)}
.shelfwrap{display:flex;justify-content:center}

@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bobbing{animation:bob 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

function fmt(s) { return String(s || '').replace(/\{name\}/g, S.name || 'Hero'); }
function charName(who) {
  if (who === 'hero') return S.name;
  if (who && who.startsWith('chick:')) return who.split(':')[1];
  return CHAR[who] ? CHAR[who].name : '';
}
function questFlag(npc) { const q = QUESTS[npc]; return q ? dprog(q.district).quest === 2 : false; }
function drawPortrait(c, who, w, hh, t, mood, talk) {
  if (!who) return;
  if (who.startsWith('chick:')) { drawChicken(c, w / 2 - 6, hh - 14, 1.75, { color: who.split(':')[2] || 'white', t, happy: mood === 'joy', shadow: false }); return; }
  const key = who === 'hero' ? S.hero : who, ch = CHAR[key]; if (!ch) return;
  const k = Math.min(1.05, 104 / ch.h);
  drawChar(c, key, w / 2, hh - 4, k, { t, mood, talk, shadow: false, hat: who === 'hero' ? S.hat : null, cape: who === 'hero' ? S.cape : null, flag: questFlag(key), seed: 1 });
}

/* ---------- Dialogue ---------- */
function say(lines, onDone, opts = {}) {
  lines = (lines || []).filter(Boolean);
  if (!lines.length) { if (onDone) onDone(); return null; }
  let i = 0, cur = null, full = '', shown = 0, typing = false, m = null;
  const pc = new Mini(116, 116);
  const who = h('div', { class: 'who' }), tx = h('div', { class: 'txt' }), acts = h('div', { class: 'acts' });
  const spk = speakBtn(() => full); spk.style.width = '36px'; spk.style.height = '36px';
  const box = h('div', { class: 'dlg panel lined', role: 'dialog', 'aria-label': 'Conversation' }, h('div', { class: 'portrait' }, pc.c), h('div', { class: 'body' }, who, tx, acts));
  function show() {
    cur = lines[i]; full = fmt(cur.text); shown = 0; typing = true; tx.textContent = '';
    who.innerHTML = ''; who.append(charName(cur.who)); who.appendChild(spk);
    if (PREFS.autoRead) SPEECH.speak(full);
    buildActs();
  }
  function buildActs() {
    acts.innerHTML = '';
    if (cur.choices) {
      if (typing) { acts.appendChild(h('button', { class: 'btn sm paper', type: 'button', onclick: () => finishTyping() }, 'Show all')); return; }
      cur.choices.forEach((ch, k) => acts.appendChild(h('button', { class: 'btn sm ' + (k === 0 ? '' : 'paper'), type: 'button', onclick: () => choose(ch) }, ch.label)));
      setTimeout(() => { const b = acts.querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { } }, 20);
    } else {
      const b = h('button', { class: 'btn sm', type: 'button', onclick: advance }, i < lines.length - 1 ? 'Next' : (opts.last || 'OK'));
      acts.appendChild(b); setTimeout(() => { try { b.focus({ preventScroll: true }); } catch (e) { } }, 20);
    }
  }
  function finishTyping() { typing = false; tx.textContent = full; buildActs(); }
  function advance() {
    SFX.click();
    if (typing) { finishTyping(); return; }
    if (cur.choices) return;
    if (cur.fn) cur.fn();
    i++; if (i >= lines.length) close(); else show();
  }
  function choose(ch) {
    SFX.click();
    const r = ch.go ? ch.go() : null;
    if (Array.isArray(r) && r.length) { lines = r.filter(Boolean); i = 0; show(); } else close();
  }
  function close() { SPEECH.stop(); Modal.close(m); if (onDone) onDone(); }
  m = Modal.open(box, {
    clear: true, pause: true, noFocus: true,
    key: e => {
      if (e.key === ' ' || e.key === 'Enter') { if (cur.choices && !typing) return false; advance(); return true; }
      if (cur.choices && !typing && /^[1-9]$/.test(e.key)) { const ch = cur.choices[+e.key - 1]; if (ch) { choose(ch); return true; } }
      return false;
    },
    tick: dt => {
      if (typing) { shown += dt * 62; const n = Math.floor(shown); tx.textContent = full.slice(0, n); if (n >= full.length) finishTyping(); }
      pc.draw((c, w, hh) => drawPortrait(c, cur.who, w, hh, G.t, cur.mood || 'happy', typing));
    },
  });
  show();
  return m;
}

/* ---------- Math panel ---------- */
function mathPanel(opts) {
  const p = opts.problem, mode = opts.mode || answerMode(opts.kind);
  let tries = 0, input = '', done = false; const t0 = performance.now();
  const slot = h('div', { class: 'slot', 'aria-live': 'polite' }, '?');
  const eq = h('div', { class: 'eq', 'aria-label': `${p.say} equals what?` }, h('span', null, p.text), h('span', null, '='), slot);
  const hint = h('div', { class: 'hint', 'aria-live': 'polite' }, opts.prompt || (mode === 'pad' ? 'Tap the numbers, then the green check.' : 'Pick the right answer!'));
  const story = opts.story ? h('div', { class: 'story' }, opts.story) : null;
  const read = () => SPEECH.speak((opts.story ? opts.story + ' ' : '') + p.say + ' equals what?');
  const left = h('div', { class: 'left' }, story, h('div', { class: 'row center' }, opBadge(p.op), eq, speakBtn(read)), hint);
  let right;
  const btns = [];
  if (mode === 'pad') {
    right = h('div', { class: 'pad', role: 'group', 'aria-label': 'Number pad' });
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'go'].forEach(k => {
      const b = h('button', { class: 'btn key ' + (k === 'go' ? 'go' : k === 'del' ? 'del' : 'paper'), type: 'button', 'aria-label': k === 'del' ? 'Delete' : k === 'go' ? 'Check my answer' : k, onclick: () => press(k) }, k === 'del' ? '⌫' : k === 'go' ? '✓' : k);
      btns.push(b); right.appendChild(b);
    });
  } else {
    right = h('div', { class: 'choices', role: 'group', 'aria-label': 'Answer choices' });
    choicesFor(p, 4).forEach(v => { const b = h('button', { class: 'btn choice paper', type: 'button', onclick: e => check(v, e.currentTarget) }, String(v)); btns.push(b); right.appendChild(b); });
  }
  const el = h('div', { class: 'math' }, left, right);
  if (PREFS.autoRead && opts.autoSpeak !== false) setTimeout(read, 250);
  function render() { slot.textContent = input || '?'; slot.className = 'slot' + (input ? ' filled' : ''); }
  function press(k) {
    if (done) return; SFX.click();
    if (k === 'del') input = input.slice(0, -1);
    else if (k === 'go') { if (!input) { slot.classList.add('shake'); setTimeout(() => slot.classList.remove('shake'), 420); return; } check(parseInt(input, 10)); return; }
    else if (input.length < 4) input = (input === '0' ? '' : input) + k;
    render();
  }
  function finish(res) { done = true; btns.forEach(b => b.disabled = true); return res; }
  function check(v, btn) {
    if (done) return;
    if (v === p.ans) {
      finish();
      slot.textContent = String(v); slot.className = 'slot ok';
      if (btn) { btn.classList.remove('paper'); btn.classList.add('mint'); }
      hint.className = 'hint good'; hint.textContent = pick(['Yes!', 'Correct!', 'You got it!', 'Awesome!', 'Nailed it!', 'Super!']) + `  ${p.text} = ${p.ans}`;
      SFX.correct(); recordResult(p.op, tries === 0);
      setTimeout(() => opts.onDone({ ok: true, first: tries === 0, ms: performance.now() - t0 }), 800);
      return;
    }
    tries++; SFX.wrong();
    slot.textContent = String(v); slot.className = 'slot no';
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    if (btn) btn.disabled = true;
    if (tries === 1 && opts.retry !== false) {
      hint.className = 'hint oops'; hint.textContent = 'Almost! ' + hintFor(p);
      if (PREFS.autoRead) SPEECH.speak(hint.textContent);
      input = ''; setTimeout(() => { if (!done) render(); }, 600);
    } else {
      finish(); recordResult(p.op, false);
      slot.textContent = String(p.ans); slot.className = 'slot ok';
      hint.className = 'hint'; hint.innerHTML = `The answer is <b>${p.ans}</b>. ${explainFor(p)}`;
      const ok = h('button', { class: 'btn sky sm', type: 'button', onclick: () => { SFX.click(); opts.onDone({ ok: false }); } }, 'Got it!');
      left.appendChild(ok); setTimeout(() => { try { ok.focus({ preventScroll: true }); } catch (e) { } }, 30);
    }
  }
  function key(e) {
    if (done) return false;
    if (mode === 'pad') {
      if (/^[0-9]$/.test(e.key)) { press(e.key); return true; }
      if (e.key === 'Backspace') { press('del'); return true; }
      if (e.key === 'Enter') { press('go'); return true; }
    } else if (/^[1-4]$/.test(e.key)) { const b = btns[+e.key - 1]; if (b && !b.disabled) b.click(); return true; }
    return false;
  }
  return { el, key, problem: p };
}

}

/* ---------- Mini-games ---------- */
const MINI_INFO = {
  egg: { name: 'Egg Catch', desc: 'Eggs are falling! Catch the one with the right answer in your basket. Use the arrow keys, or tap where you want the basket to go.' },
  snow: { name: 'Snow Catch', desc: 'Snowballs are falling! Catch the one with the right answer in your mitten. Use the arrow keys, or tap where you want to go.' },
  bubble: { name: 'Bubble Pop', desc: 'Bubbles float up with numbers inside. Tap the bubble with the right answer before it floats away!' },

function MiniGame(game, o) {

  let timeLeft = 45, mp = null, cust = null;
  const laneX = i => G.W * (.2 + .2 * i);
  const later = (ms, fn) => setTimeout(() => { if (alive) fn(); }, ms);

    const root = sceneUI(); root.innerHTML = '';

    root.appendChild(h('div', { class: 'hud' }, h('div', { class: 'grp' }, h('div', { class: 'chip', style: { fontSize: '18px' } }, info.name), ui.round, ui.score), h('div', { class: 'grp' }, soundBtn(), h('button', { class: 'btn sm paper', type: 'button', onclick: () => { SFX.click(); finish(); } }, 'Stop'))));
    ui.q = h('div', { class: 'panel', style: { position: 'absolute', top: '64px', left: '50%', transform: 'translateX(-50%)', padding: '6px 18px', display: 'flex', alignItems: 'center', gap: '10px', whiteSpace: 'nowrap' } });
    if (game !== 'lunch') root.appendChild(ui.q);
    ui.lunch = h('div', { class: 'bpanel panel lined', hidden: game !== 'lunch' }); root.appendChild(ui.lunch);
    hud();
  }
  function hud() {
    ui.score.innerHTML = ICON.star(18) + ` ${earned}`;
    ui.round.textContent = game === 'lunch' ? `Time: ${Math.ceil(timeLeft)}s · Served: ${score}` : `Round ${Math.min(round, ROUNDS)} of ${ROUNDS}`;
  }
  function showQ() { ui.q.innerHTML = ''; ui.q.append(opBadge(p.op), h('span', { class: 'eq', style: { fontSize: '40px' } }, `${p.text} = ?`), speakBtn(() => p.say + ' equals what?')); if (PREFS.autoRead) SPEECH.speak(p.say + ' equals what?'); }
  function gain(base) { combo++; const pts = base + Math.min(combo - 1, 5) * 2; earned += pts; addPoints(pts); fxFloat(fx, `+${pts}`, G.W / 2, 160, '#ffd23f', 28); hud(); }
  function nextRound() {
    if (!alive) return;
    round++; if (round > ROUNDS) { finish(); return; }
    p = genProblem(); first = true; resolved = false; escapes = 0; hud(); showQ();
    if (game === 'egg' || game === 'snow') {
      const ch = choicesFor(p, 4);
      items = ch.map((v, i) => ({ v, lane: i, y: 196, vy: 60 + round * 3, state: 'wait', delay: .5 + rand(0, 1.1) }));
    } else spawnBubbles();
  }
  function spawnBubbles() {

    items = ch.map((v, i) => ({ v, x: G.W * (.14 + .18 * xs[i]), y: G.H + 40 + rand(0, 120), vy: -(42 + round * 2 + rand(0, 14)), r: 42, ph: rand(0, 6), state: 'up' }));

}

/* ---------- Ending ---------- */

/* ---------- Boot ---------- */
let lastT = performance.now();

}

}
